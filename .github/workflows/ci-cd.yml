name: CI-CD

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace @synapsehub/shared

      - name: Unit and integration tests
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Build
        run: npm run build

  docker-publish:
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    strategy:
      matrix:
        include:
          - image: api-gateway
            workspace: "@synapsehub/api"
          - image: web
            workspace: "@synapsehub/web"
          - image: auth-service
            workspace: "@synapsehub/auth-service"
          - image: user-service
            workspace: "@synapsehub/user-service"
          - image: workspace-service
            workspace: "@synapsehub/workspace-service"
          - image: channel-service
            workspace: "@synapsehub/channel-service"
          - image: messaging-service
            workspace: "@synapsehub/messaging-service"
          - image: notification-service
            workspace: "@synapsehub/notification-service"
          - image: file-service
            workspace: "@synapsehub/file-service"
          - image: search-service
            workspace: "@synapsehub/search-service"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/workspace.Dockerfile
          push: true
          build-args: |
            BUILD_WORKSPACE=${{ matrix.workspace }}
          tags: ghcr.io/${{ github.repository_owner }}/synapsehub-${{ matrix.image }}:${{ github.sha }}

  deploy-kubernetes:
    needs: docker-publish
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config

      - name: Deploy manifests
        run: |
          kubectl apply -f infrastructure/kubernetes/synapsehub.yaml
          kubectl apply -f infrastructure/kubernetes/observability.yaml
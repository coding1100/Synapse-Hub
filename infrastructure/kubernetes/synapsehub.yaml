apiVersion: v1
kind: Namespace
metadata:
  name: synapsehub
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: synapsehub-config
  namespace: synapsehub
data:
  DATABASE_URL: postgresql://postgres:postgres@synapsehub-postgres:5432/synapsehub
  REDIS_URL: redis://synapsehub-redis:6379
  ELASTICSEARCH_NODE: http://synapsehub-elasticsearch:9200
  S3_ENDPOINT: http://synapsehub-minio:9000
  S3_BUCKET: synapsehub-files
  AUTH_SERVICE_URL: http://auth-service:4001
  USER_SERVICE_URL: http://user-service:4002
  WORKSPACE_SERVICE_URL: http://workspace-service:4003
  CHANNEL_SERVICE_URL: http://channel-service:4004
  MESSAGING_SERVICE_URL: http://messaging-service:4005
  NOTIFICATION_SERVICE_URL: http://notification-service:4006
  FILE_SERVICE_URL: http://file-service:4007
  SEARCH_SERVICE_URL: http://search-service:4008
---
apiVersion: v1
kind: Secret
metadata:
  name: synapsehub-secrets
  namespace: synapsehub
type: Opaque
stringData:
  JWT_ACCESS_SECRET: change-me-access
  JWT_REFRESH_SECRET: change-me-refresh
  POSTGRES_PASSWORD: postgres
  S3_ACCESS_KEY: minio
  S3_SECRET_KEY: minio123
---
apiVersion: v1
kind: Service
metadata:
  name: synapsehub-postgres
  namespace: synapsehub
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: synapsehub-postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: synapsehub-postgres
  namespace: synapsehub
spec:
  serviceName: synapsehub-postgres
  replicas: 1
  selector:
    matchLabels:
      app: synapsehub-postgres
  template:
    metadata:
      labels:
        app: synapsehub-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: synapsehub
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: synapsehub-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: synapsehub-redis
  namespace: synapsehub
spec:
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: synapsehub-redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synapsehub-redis
  namespace: synapsehub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: synapsehub-redis
  template:
    metadata:
      labels:
        app: synapsehub-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: synapsehub-elasticsearch
  namespace: synapsehub
spec:
  ports:
    - port: 9200
      targetPort: 9200
  selector:
    app: synapsehub-elasticsearch
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synapsehub-elasticsearch
  namespace: synapsehub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: synapsehub-elasticsearch
  template:
    metadata:
      labels:
        app: synapsehub-elasticsearch
    spec:
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.15.2
          env:
            - name: discovery.type
              value: single-node
            - name: xpack.security.enabled
              value: "false"
            - name: ES_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
          ports:
            - containerPort: 9200
---
apiVersion: v1
kind: Service
metadata:
  name: synapsehub-minio
  namespace: synapsehub
spec:
  ports:
    - port: 9000
      targetPort: 9000
  selector:
    app: synapsehub-minio
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synapsehub-minio
  namespace: synapsehub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: synapsehub-minio
  template:
    metadata:
      labels:
        app: synapsehub-minio
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: synapsehub-secrets
                  key: S3_ACCESS_KEY
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: synapsehub-secrets
                  key: S3_SECRET_KEY
          ports:
            - containerPort: 9000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: synapsehub
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: ghcr.io/synapsehub/api-gateway:latest
          ports:
            - containerPort: 4000
          env:
            - name: PORT
              value: "4000"
          envFrom:
            - configMapRef:
                name: synapsehub-config
            - secretRef:
                name: synapsehub-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: synapsehub
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - port: 4000
      targetPort: 4000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: synapsehub
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: ghcr.io/synapsehub/web:latest
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: https://api.synapsehub.local
            - name: NEXT_PUBLIC_WS_URL
              value: https://api.synapsehub.local
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: synapsehub
spec:
  type: ClusterIP
  selector:
    app: web
  ports:
    - port: 3000

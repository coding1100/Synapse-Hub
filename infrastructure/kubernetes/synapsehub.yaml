apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: synapsehub-ingress
  namespace: synapsehub
spec:
  ingressClassName: nginx
  rules:
    - host: app.synapsehub.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 3000
    - host: api.synapsehub.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 4000